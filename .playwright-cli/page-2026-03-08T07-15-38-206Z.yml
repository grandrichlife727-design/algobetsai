              - generic [ref=e766]: 1) Run Scan 2) Check +EV and Odds 3) Size bets with bankroll rules 4) Track outcomes.
              - generic [ref=e767]: "Best practice: skip forced bets when the board is thin. Use Tomorrow’s Games to plan ahead."
            - generic [ref=e768]:
              - generic [ref=e769]: Core Tabs
              - generic [ref=e770]: "Picks: ranked opportunities with edge and confidence."
              - generic [ref=e771]: "Odds: book-by-book moneylines (Today/Tomorrow/Week)."
              - generic [ref=e772]: "+EV: opportunities priced above fair value."
              - generic [ref=e773]: "Steam/Fades: market pressure and contrarian spots."
            - generic [ref=e774]:
              - generic [ref=e775]: How Live Picks Work
              - generic [ref=e776]: Live mode focuses on games near start or in-play windows where lines can move quickly.
              - generic [ref=e777]: Use it to monitor timing-sensitive spots, then confirm current odds before placing.
              - generic [ref=e778]: If a price moves against you, the edge may be gone. Re-check before entry.
            - generic [ref=e779]:
              - generic [ref=e780]: How +EV Works
              - generic [ref=e781]: +EV compares best available book price to estimated fair probability (after de-vig).
              - generic [ref=e782]: Higher +EV means better long-run value, not guaranteed short-term wins.
              - generic [ref=e783]: Prioritize stronger EV with acceptable confidence and line stability.
            - generic [ref=e784]:
              - generic [ref=e785]: How Steam Works
              - generic [ref=e786]: Steam flags fast market movement and book divergence that can indicate sharp pressure.
              - generic [ref=e787]: "Best use: identify where price is likely to keep moving, then act before it closes."
              - generic [ref=e788]: Premium users get full steam access and faster refresh windows.
            - generic [ref=e789]:
              - generic [ref=e790]: How Fades Work
              - generic [ref=e791]: Fades surface situations where public ticket flow is heavy on one side.
              - generic [ref=e792]: When pricing still favors the opposite side, contrarian value can appear.
              - generic [ref=e793]: Fade signals are strongest when supported by EV and line/steam context.
            - generic [ref=e794]:
              - generic [ref=e795]: How Props Work
              - generic [ref=e796]: Props Edge scans selected player markets and shows best available price/book.
              - generic [ref=e797]: Use props as single positions or pair with straight bets only when value supports it.
              - generic [ref=e798]: Props are budget-guarded to keep API spend controlled and data quality stable.
            - generic [ref=e799]:
